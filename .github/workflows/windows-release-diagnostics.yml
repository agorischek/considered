name: Windows release diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-release-diagnostics.yml
      - scripts/windows-release-diagnostics.ps1

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Diagnose immutable v0.1.11 publication
        shell: pwsh
        run: ./scripts/windows-release-diagnostics.ps1
      - name: Preserve diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-diagnostics-${{ matrix.runner }}
          path: ${{ runner.temp }}/considered-diagnostics
          retention-days: 7
          if-no-files-found: error
