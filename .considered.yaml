exclude:
    gitignored: true
    categories:
        - assets
        - generated
    paths:
        - "**/*_test.go"
        - bin/**

standards:
    scc.code_lines:
        max: 500
    scc.complexity:
        max: 50
    filesystem.bytes:
        max: 50000
    filesystem.longest_line:
        max: 140

variances:
    internal/considered/report.go:
        kind: architectural
        reason: >
            Report formatting keeps each record's layout in one fmt string so
            the output shape is visible at a glance.
        metrics:
            filesystem.longest_line:
                max: 220
            scc.complexity:
                max: 60
    internal/considered/config.go:
        kind: architectural
        reason: >
            Configuration validation and built-in categories deliberately keep
            repository policy rules in one auditable place.
        metrics:
            scc.complexity:
                max: 90
    internal/considered/providers.go:
        kind: architectural
        reason: >
            Provider dispatch and the filesystem walk are the integration
            seam between the policy engine and the outside world.
        metrics:
            scc.complexity:
                max: 60
    internal/considered/variance.go:
        kind: architectural
        reason: >
            The interactive variance-add flow branches over which fields were
            supplied versus prompted.
        metrics:
            scc.complexity:
                max: 75
